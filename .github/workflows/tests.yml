name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
        backend: [python, numba]
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      UAG_CI_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install NumPy backend
        if: matrix.backend == 'python'
        run: python -m pip install ".[test]"
      - name: Install compiled backend
        if: matrix.backend == 'numba'
        run: python -m pip install ".[test,accelerated]"
      - name: Test
        run: python -m pytest -q
      - name: Check installed backend and accounting
        run: python -c "import os, pathlib, numpy as np, uag; assert 'site-packages' in str(pathlib.Path(uag.__file__).resolve()); backend = os.environ['UAG_CI_BACKEND']; fg = lambda x:(0.5*float(x@x),x.copy()); fg = __import__('numba').njit(fg) if backend == 'numba' else fg; r = uag.minimize(fg, [1.,2.], max_evals=16, backend=backend); assert r.success and r.grad_norm <= 1e-6; assert r.nfev == r.work.counts.sum(); print(r.backend, r.status, r.nfev)"
      - name: Build wheel
        run: python -m pip wheel --no-deps . -w dist
